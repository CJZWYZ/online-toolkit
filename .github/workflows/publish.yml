name: publish
# 定时归集信号 → 重新生成 → 提交。Pages 直接托管仓库根目录，提交即上线。
on:
  schedule:
    - cron: '0 1 * * 1'          # 每周一 01:00 UTC（可调）
  workflow_dispatch:              # 允许手动触发
  push:
    branches: [main]
    paths: ['content/**', 'scripts/**', 'data/**']   # 稿件或配置变更时重建
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 抓取真实公开信源并生成全部静态页面（零依赖，无需 npm install）
      - run: node scripts/build.mjs
      - name: 提交生成结果
        run: |
          git config user.name "tiaqi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动归集与构建 $(date +%F)"
            git push
          fi
