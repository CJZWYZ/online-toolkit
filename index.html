<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历 · 今日天气</title>
  <meta name="description" content="极简日历与黄历：自动获取当天日期与实时天气，侧边栏显示农历、干支、生肖、宜忌、冲煞，背景随天气与昼夜联动。" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect x='8' y='12' width='32' height='30' rx='5' fill='%23fff' stroke='%231d1d1f' stroke-width='3'/><path d='M8 20 H40' stroke='%231d1d1f' stroke-width='3'/><path d='M16 8 V14 M32 8 V14' stroke='%231d1d1f' stroke-width='3' stroke-linecap='round'/><rect x='20' y='26' width='8' height='8' rx='2' fill='%230071e3'/></svg>" />
</head>
<body>
  <div class="page">

    <!-- 顶部极简导航 -->
    <nav class="topbar">
      <span class="brand">日历</span>
      <span class="brand-sub">今日 · 天气 · 黄历</span>
    </nav>

    <div class="layout">
      <!-- 侧边栏：日历 + 农历 + 黄历 -->
      <aside class="sidebar">
        <section class="card calendar-card" id="calendar" aria-label="日历">
          <div class="cal-bar">
            <button class="cal-nav" id="cal-prev" aria-label="上个月">‹</button>
            <div class="cal-title" id="cal-title">—</div>
            <button class="cal-nav" id="cal-next" aria-label="下个月">›</button>
          </div>
          <div class="cal-grid cal-compact" id="cal-grid"></div>
          <p class="cal-hint" id="cal-hint">点击某天查看其农历与黄历</p>
        </section>

        <section class="card almanac" id="almanac" aria-label="农历黄历">
          <div class="al-lunar" id="al-lunar">农历 —</div>
          <div class="al-ganzhi" id="al-ganzhi">—</div>

          <div class="al-tags">
            <span class="al-tag" id="al-zodiac">生肖 —</span>
            <span class="al-tag" id="al-jianchu">—</span>
          </div>

          <div class="al-yiji">
            <div class="al-yi">
              <div class="h">宜</div>
              <div class="c" id="al-yi">—</div>
            </div>
            <div class="al-ji">
              <div class="h">忌</div>
              <div class="c" id="al-ji">—</div>
            </div>
          </div>

          <div class="al-chong" id="al-chong">—</div>
        </section>
      </aside>

      <!-- 主区：日期 + 天气 -->
      <main class="content">
        <header class="hero">
          <p class="eyebrow" id="eyebrow">今天</p>
          <h1 class="date-hero" id="big-date">—</h1>
          <p class="date-sub" id="date-sub">—</p>

          <section class="weather" id="weather" aria-label="实时天气">
            <div class="weather-ico" id="w-ico" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="52" height="52">
                <circle cx="24" cy="24" r="9" fill="#ffd60a" stroke="#1d1d1f" stroke-width="3"/>
                <g stroke="#1d1d1f" stroke-width="3" stroke-linecap="round">
                  <path d="M24 6 V11"/><path d="M24 37 V42"/><path d="M6 24 H11"/><path d="M37 24 H42"/>
                  <path d="M11 11 L15 15"/><path d="M33 33 L37 37"/><path d="M37 11 L33 15"/><path d="M15 33 L11 37"/>
                </g>
              </svg>
            </div>
            <div class="weather-main">
              <div class="weather-temp"><span id="w-temp">--</span><span class="deg">°</span></div>
              <div class="weather-meta">
                <span id="w-desc">加载中…</span>
                <span class="sep">·</span>
                <span id="w-city">—</span>
              </div>
            </div>
            <div class="weather-search">
              <input type="text" id="w-input" placeholder="切换城市，如 上海" aria-label="城市搜索" />
              <button class="btn-search" id="w-search">搜索</button>
            </div>
          </section>
          <p class="weather-extra-line" id="w-extra">湿度 — · 风 —</p>
        </header>

        <footer class="footer">
          <p>天气来自 Open-Meteo · 农历黄历为算法推算，仅供参考 · 背景随天气与昼夜联动</p>
        </footer>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
