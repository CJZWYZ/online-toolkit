<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>今日 · 天气 · 黄历</title>
  <meta name="description" content="极简日历黄历：首页显示当天日期、实时天气与农历黄历简略信息；侧边栏点开显示完整日历与详细黄历，自动适配电脑与手机。" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect x='8' y='12' width='32' height='30' rx='5' fill='%23fff' stroke='%231d1d1f' stroke-width='3'/><path d='M8 20 H40' stroke='%231d1d1f' stroke-width='3'/><path d='M16 8 V14 M32 8 V14' stroke='%231d1d1f' stroke-width='3' stroke-linecap='round'/><rect x='20' y='26' width='8' height='8' rx='2' fill='%230071e3'/></svg>" />
</head>
<body>
  <!-- 地区风景背景：跟随当前天气城市，苹果风毛玻璃叠加 -->
  <div class="bg-photo" id="bg-photo" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="bg-caption" id="bg-caption" aria-hidden="true"></div>

  <!-- 顶部极简导航：含打开侧边栏的按钮 -->
  <header class="topbar">
    <button class="menu-btn" id="menu-open" aria-label="打开日历与黄历">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="brand">今日 · 天气 · 黄历</span>
  </header>

  <!-- 首页：当天日期 + 天气 + 农历黄历简略信息 -->
  <main class="home">
    <p class="eyebrow" id="eyebrow">今天</p>
    <h1 class="date-hero" id="big-date">—</h1>
    <p class="date-sub" id="date-sub">—</p>

    <section class="weather" id="weather" aria-label="实时天气">
      <div class="weather-ico" id="w-ico" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="52" height="52">
          <circle cx="24" cy="24" r="9" fill="#ffd60a" stroke="#1d1d1f" stroke-width="3"/>
          <g stroke="#1d1d1f" stroke-width="3" stroke-linecap="round">
            <path d="M24 6 V11"/><path d="M24 37 V42"/><path d="M6 24 H11"/><path d="M37 24 H42"/>
            <path d="M11 11 L15 15"/><path d="M33 33 L37 37"/><path d="M37 11 L33 15"/><path d="M15 33 L11 37"/>
          </g>
        </svg>
      </div>
      <div class="weather-main">
        <div class="weather-temp"><span id="w-temp">--</span><span class="deg">°</span></div>
        <div class="weather-meta">
          <span id="w-desc">加载中…</span>
          <span class="sep">·</span>
          <span id="w-city">—</span>
        </div>
      </div>
      <div class="weather-search">
        <input type="text" id="w-input" placeholder="切换城市，如 上海" aria-label="城市搜索" />
        <button class="btn-search" id="w-search">搜索</button>
      </div>
    </section>
    <p class="weather-extra-line" id="w-extra">湿度 — · 风 —</p>

    <!-- 农历黄历简略信息 -->
    <section class="card brief" id="brief" aria-label="今日农历黄历简略">
      <div class="brief-lunar" id="b-lunar">农历 —</div>
      <div class="brief-ganzhi" id="b-ganzhi">—</div>
      <div class="brief-yiji">
        <span class="yi">宜 <em id="b-yi">—</em></span>
        <span class="ji">忌 <em id="b-ji">—</em></span>
      </div>
      <button class="btn-detail" id="open-detail">查看完整日历与黄历 ›</button>
    </section>

    <footer class="footer">
      <p>天气来自 Open-Meteo · 农历黄历为算法推算，仅供参考 · 背景随天气与昼夜联动</p>
    </footer>
  </main>

  <!-- 遮罩层（点击关闭侧边栏） -->
  <div class="backdrop" id="backdrop"></div>

  <!-- 侧边栏 / 第二页：完整日历 + 详细农历黄历，默认收起 -->
  <aside class="sidebar" id="sidebar" aria-label="日历与黄历详情">
    <div class="sidebar-head">
      <span>日历 · 黄历</span>
      <button class="close-btn" id="menu-close" aria-label="关闭">×</button>
    </div>

    <section class="card calendar-card" id="calendar">
      <div class="cal-bar">
        <button class="cal-nav" id="cal-prev" aria-label="上个月">‹</button>
        <div class="cal-title" id="cal-title">—</div>
        <button class="cal-nav" id="cal-next" aria-label="下个月">›</button>
      </div>
      <div class="cal-grid cal-compact" id="cal-grid"></div>
      <p class="cal-hint" id="cal-hint">点击某天查看其农历与黄历</p>
    </section>

    <section class="card almanac" id="almanac">
      <div class="al-lunar" id="al-lunar">农历 —</div>
      <div class="al-ganzhi" id="al-ganzhi">—</div>
      <div class="al-tags">
        <span class="al-tag" id="al-zodiac">生肖 —</span>
        <span class="al-tag" id="al-jianchu">—</span>
      </div>
      <div class="al-yiji">
        <div class="al-yi">
          <div class="h">宜</div>
          <div class="c" id="al-yi">—</div>
        </div>
        <div class="al-ji">
          <div class="h">忌</div>
          <div class="c" id="al-ji">—</div>
        </div>
      </div>
      <div class="al-chong" id="al-chong">—</div>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
